<style>
  :root{
    --paper:#f6f2e9;
    --ink:#2b2620;
    --navy:#22344a;
    --navy-2:#3a5170;
    --gold:#b8860b;
    --card:#fffdf8;
    --line:#d9d0bd;
    --green:#3f7d5c;
    --red:#a8442f;
    --muted:#8a8171;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family: "Georgia", "Times New Roman", serif;
    min-height:100vh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{max-width:640px; margin:0 auto; padding:18px 16px 60px;}
  header{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:2px solid var(--navy); padding-bottom:10px; margin-bottom:16px;
  }
  header h1{font-size:20px; margin:0; letter-spacing:.5px; color:var(--navy);}
  header .day-badge{
    font-family:"Helvetica Neue",Arial,sans-serif; font-size:12px; color:var(--gold);
    border:1px solid var(--gold); border-radius:20px; padding:3px 10px;
  }
  nav.tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  nav.tabs button{
    font-family:"Helvetica Neue",Arial,sans-serif; font-size:13px;
    background:none; border:1px solid var(--line); color:var(--navy-2);
    padding:7px 12px; border-radius:6px; cursor:pointer;
  }
  nav.tabs button.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .panel{display:none;}
  .panel.active{display:block;}

  .stat-row{display:flex; gap:10px; margin-bottom:16px;}
  .stat{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:10px 8px; text-align:center; font-family:"Helvetica Neue",Arial,sans-serif;
  }
  .stat b{display:block; font-size:22px; color:var(--navy); font-family:Georgia,serif;}
  .stat span{font-size:11px; color:var(--muted);}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:26px 20px; text-align:center; min-height:180px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; box-shadow: 0 2px 0 var(--line); margin-bottom:14px;
    position:relative;
  }
  .card .word{font-size:30px; color:var(--navy); font-weight:bold;}
  .card .pos{font-size:13px; color:var(--gold); margin-top:4px; font-style:italic;}
  .pron-row{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:6px;}
  .ipa{font-family:"Helvetica Neue",Arial,sans-serif; font-size:14px; color:var(--navy-2);}
  .play-btn{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--navy-2);
    background:#fff; color:var(--navy-2); cursor:pointer; font-size:13px;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .play-btn:hover{background:var(--navy-2); color:#fff;}
  .card .def{font-size:18px; margin-top:14px;}
  .card .ex{font-size:14px; color:var(--muted); margin-top:12px; line-height:1.5; text-align:left;}
  .card .ex-label{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--gold); display:block; margin-bottom:2px;}
  .card .hint{
    position:absolute; bottom:8px; right:12px; font-size:11px; color:var(--muted);
    font-family:"Helvetica Neue",Arial,sans-serif;
  }
  .btn-row{display:flex; gap:8px;}
  .btn-row button{
    flex:1; font-family:"Helvetica Neue",Arial,sans-serif; font-size:14px;
    padding:11px 6px; border-radius:8px; border:none; cursor:pointer; color:#fff;
  }
  .btn-again{background:var(--red);}
  .btn-hard{background:var(--gold);}
  .btn-good{background:var(--green);}

  .choice{
    display:block; width:100%; text-align:left; background:var(--card);
    border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:8px;
    font-family:"Helvetica Neue",Arial,sans-serif; font-size:14px; cursor:pointer; color:var(--ink);
  }
  .choice.correct{background:#e4f1ea; border-color:var(--green);}
  .choice.wrong{background:#f6e3de; border-color:var(--red);}
  .choice .cw{font-weight:bold; color:var(--navy); font-family:Georgia,serif; font-size:16px;}
  .choice .cd{display:block; margin-top:4px; font-size:12px; color:var(--muted);}
  .q-word{font-size:22px; color:var(--navy); font-weight:bold; margin-bottom:4px;}
  .q-sub{font-family:"Helvetica Neue",Arial,sans-serif; font-size:12px; color:var(--muted); margin-bottom:12px;}
  .q-sent{font-size:15px; line-height:1.6; margin-bottom:14px;}
  .blank{border-bottom:2px solid var(--navy); padding:0 4px;}

  .empty{
    text-align:center; padding:40px 20px; color:var(--muted);
    font-family:"Helvetica Neue",Arial,sans-serif; font-size:14px;
  }
  .empty .big{font-size:40px; margin-bottom:10px;}

  footer.tip{
    font-family:"Helvetica Neue",Arial,sans-serif; font-size:12px; color:var(--muted);
    text-align:center; margin-top:18px;
  }
  .reset-link{

const OLD_COHORT_SIZE = 1046;
const OLD_COHORT_DAYS = 25;
const NEW_COHORT_DAYS = 5;
const TOTAL_DAYS = OLD_COHORT_DAYS + NEW_COHORT_DAYS; // 30
const DAY_MS = 24*60*60*1000;
const INTERVALS = [1,2,4,7,15,30]; // box 0..5 -> days until next review

// Deterministic seeded shuffle so word-to-day assignment is stable across
// sessions but NOT alphabetical - keeps daily study varied and unpredictable.
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const rand = mulberry32(seed);
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rand()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// The original 1046 words keep the EXACT same shuffle/seed/day-mapping they
// have always had, so existing learners' schedules and progress records
// never shift. The 518 words added later get their own shuffle, landing on
// days 26-30 only.
const SHUFFLE_SEED = 20260705;
const NEW_COHORT_SHUFFLE_SEED = 20260930;

const OLD_VOCAB = VOCAB.slice(0, OLD_COHORT_SIZE);
const NEW_VOCAB = VOCAB.slice(OLD_COHORT_SIZE);

const ORDERED_OLD = seededShuffle(OLD_VOCAB, SHUFFLE_SEED);
const PER_DAY_OLD = Math.ceil(ORDERED_OLD.length / OLD_COHORT_DAYS);
ORDERED_OLD.forEach((v,i)=>{ v.id = 'w'+VOCAB.indexOf(v); v.day = Math.floor(i/PER_DAY_OLD)+1; });

const ORDERED_NEW = seededShuffle(NEW_VOCAB, NEW_COHORT_SHUFFLE_SEED);
const PER_DAY_NEW = Math.ceil(ORDERED_NEW.length / NEW_COHORT_DAYS) || 1;
ORDERED_NEW.forEach((v,i)=>{ v.id = 'w'+VOCAB.indexOf(v); v.day = OLD_COHORT_DAYS + Math.floor(i/PER_DAY_NEW)+1; });

const ORDERED_VOCAB = ORDERED_OLD.concat(ORDERED_NEW);

let startDate = null;   // ms timestamp of day 1 (original 25-day cohort)
let newCohortStartDate = null; // ms timestamp of day 1 of the 518-word cohort
let todayIndex = 1;         // days elapsed since startDate (uncapped)
let newCohortTodayIndex = OLD_COHORT_DAYS + 1; // real day number for new cohort (26-30+, uncapped)

let currentUser = null;
let lastKnownUid = undefined; // undefined = not yet resolved, null = guest, string = uid

function todayMs(){ const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }

// Every account (and the no-account/guest mode) gets its OWN localStorage
// keys, so progress never bleeds between different logins on the same device.
function storageKey(base){
  const suffix = currentUser ? currentUser.uid : 'local';
  return base + '_' + suffix;
}

async function loadLocalOnly(){
  try{
    const v = localStorage.getItem(storageKey('sv_start_date'));
    startDate = v ? parseInt(v,10) : null;
  }catch(e){ startDate = null; }
  if(!startDate){
    startDate = todayMs();
  }
  todayIndex = Math.floor((todayMs()-startDate)/DAY_MS)+1;

  try{
    const v = localStorage.getItem(storageKey('sv_new_cohort_start'));
    newCohortStartDate = v ? parseInt(v,10) : null;
  }catch(e){ newCohortStartDate = null; }
  if(!newCohortStartDate && todayIndex > OLD_COHORT_DAYS){
    // Only start the new 518-word cohort's 5-day clock once the learner has
    // actually reached/finished the original 25-day cohort — never earlier,
    // so new words can't flood in mid-way through the original plan.
    newCohortStartDate = todayMs();
    try{ localStorage.setItem(storageKey('sv_new_cohort_start'), String(newCohortStartDate)); }catch(e){}
  }
  newCohortTodayIndex = newCohortStartDate
    ? (OLD_COHORT_DAYS + Math.floor((todayMs()-newCohortStartDate)/DAY_MS)+1)
    : OLD_COHORT_DAYS; // not started yet -> no new-cohort word counts as introduced

  try{
    const v = localStorage.getItem(storageKey('sv_progress'));
    progress = v ? JSON.parse(v) : {};
  }catch(e){ progress = {}; }
}

async function loadState(){
  // Fast first paint in guest mode; corrected moments later once Firebase
  // resolves whether a previous login session should be restored instead.
  currentUser = null;
  await loadLocalOnly();
}

async function saveProgress(){
  try{ localStorage.setItem(storageKey('sv_start_date'), String(startDate)); }catch(e){}
  if(newCohortStartDate){
    try{ localStorage.setItem(storageKey('sv_new_cohort_start'), String(newCohortStartDate)); }catch(e){}
  }
  try{ localStorage.setItem(storageKey('sv_progress'), JSON.stringify(progress)); }catch(e){}
  if(fbEnabled && currentUser){
    try{
      const payload = {
        progress: progress,
        startDate: startDate,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      if(newCohortStartDate) payload.newCohortStartDate = newCohortStartDate;
      await db.collection('users').doc(currentUser.uid).set(payload, {merge:true});
      setSyncBadge(true);
    }catch(e){ console.warn('cloud save failed', e); setSyncBadge(false, true); }
  }
}

// ---------- Cloud account sync ----------
function setSyncBadge(synced, error){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  if(currentUser){
    el.className = 'sync-badge' + (synced ? ' synced' : '');
    el.textContent = error ? ('Signed in as ' + currentUser.email + ' — sync error, will retry')
                           : ('Signed in as ' + currentUser.email + (synced ? ' — synced' : ' — syncing…'));
  } else {
    el.className = 'sync-badge';
    el.textContent = 'Not signed in — progress is saved on this device only';
  }
}

async function pullCloudProgress(){
  if(!fbEnabled || !currentUser) return;
  try{
    const doc = await db.collection('users').doc(currentUser.uid).get();
    if(doc.exists){
      const data = doc.data();
      progress = data.progress || {};
      startDate = data.startDate || todayMs();
      todayIndex = Math.floor((todayMs()-startDate)/DAY_MS)+1;
      const shouldStartNewCohortNow = !data.newCohortStartDate && todayIndex > OLD_COHORT_DAYS;
      newCohortStartDate = data.newCohortStartDate || (shouldStartNewCohortNow ? todayMs() : null);
      newCohortTodayIndex = newCohortStartDate
        ? (OLD_COHORT_DAYS + Math.floor((todayMs()-newCohortStartDate)/DAY_MS)+1)
        : OLD_COHORT_DAYS;
      try{
        localStorage.setItem(storageKey('sv_progress'), JSON.stringify(progress));
        localStorage.setItem(storageKey('sv_start_date'), String(startDate));
        if(newCohortStartDate) localStorage.setItem(storageKey('sv_new_cohort_start'), String(newCohortStartDate));
      }catch(e){}
      if(shouldStartNewCohortNow){
        await saveProgress(); // persist the freshly-started 5-day new-word clock
      }
    } else {
      // Brand new account: always start completely empty. Never carry over
      // whatever happened to be in memory from a previous session/account.
      progress = {};
      startDate = todayMs();
      newCohortStartDate = null; // will start once this new account reaches day 25
      await saveProgress(); // creates this account's cloud doc + local cache
    }
    setSyncBadge(true);
    renderAll();
  }catch(e){ console.warn('cloud pull failed', e); setSyncBadge(false, true); }
}

if(fbEnabled){
  auth.onAuthStateChanged(async (user)=>{
    const newUid = user ? user.uid : null;
    if(newUid !== lastKnownUid){
      // Identity changed (logged in, logged out, or switched accounts) —
      // wipe in-memory state first so nothing from the old identity leaks.
      progress = {};
      startDate = null;
    }
    lastKnownUid = newUid;
    currentUser = user;
    setSyncBadge(!!user);

    await loadLocalOnly(); // this identity's own cached copy (fast, offline-safe)
    if(user){
      await pullCloudProgress(); // reconcile with cloud (cloud wins if present)
    }
    renderAccountPanel();
    renderAll();
  });
}

    };
  }
}

function getRecord(id){
  if(!progress[id]) progress[id] = {box:0, next:null, seen:0, correct:0, wrong:0};
  return progress[id];
}

// Old-cohort words (day 1-25) are measured against the original startDate
// clock; new-cohort words (day 26-30) are measured against their own
// separate 5-day clock, which starts the first time this account/device
// sees the update — regardless of how far along the original clock is.
function effectiveTodayFor(v){
  return v.day <= OLD_COHORT_DAYS ? todayIndex : newCohortTodayIndex;
}
function isIntroduced(v){ return v.day <= effectiveTodayFor(v); }
function isDue(v){
  const r = progress[v.id];
  if(!r || r.next===null) return false;
  return r.next <= todayIndex;
}
function isNewToday(v){
  const r = progress[v.id];
  return v.day === effectiveTodayFor(v) && (!r || r.seen===0);
}
function isMastered(v){
  const r = progress[v.id];
  return r && r.box >= 5;
}

function markResult(v, quality){
  // quality: 0 = again/wrong, 1 = hard, 2 = good/correct
  const r = getRecord(v.id);
  r.seen++;
  if(quality===0){
    r.box = 0;
    r.wrong++;
  } else if(quality===1){
    r.box = Math.max(0, r.box);
    r.correct++;
  } else {
    r.box = Math.min(5, r.box+1);
    r.correct++;
  }
  r.next = todayIndex + INTERVALS[Math.min(r.box, INTERVALS.length-1)];
  saveProgress();
}

// ---------- Speech synthesis for American pronunciation ----------
let usVoice = null;
function pickVoice(){
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  usVoice = voices.find(v=>v.lang==='en-US') || voices.find(v=>v.lang && v.lang.startsWith('en')) || null;
}
if(window.speechSynthesis){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}
function speakWord(word){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  if(usVoice) u.voice = usVoice;
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}
function boldify(text){
  return text.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// Weight a word's chance of showing up in quiz/fill rounds: words that are
// due for review, or that have been gotten wrong more than right, come up
// far more often; already-mastered words come up rarely (but not never).
function priorityWeight(v){
  const r = progress[v.id];
  if(!r || r.seen===0) return 3;               // freshly introduced
  if(r.wrong > r.correct) return 8;             // struggling — highest priority
  if(isDue(v)) return 6;                        // due for review right now
  if(r.box <= 1) return 5;                       // still early in the SRS cycle
  if(r.box >= 5) return 1;                       // mastered — rare, just for upkeep
  return 3;                                      // steadily learning
}

function weightedSample(words, n){
  const weighted = [];
  words.forEach(v=>{
    const w = priorityWeight(v);
    for(let i=0;i<w;i++) weighted.push(v);
  });
  const shuffled = shuffle(weighted);
  const seen = new Set();
  const result = [];
  for(const v of shuffled){
    if(!seen.has(v.id)){
      seen.add(v.id);
      result.push(v);
      if(result.length>=n) break;
    }
  }
  return result;
}

function updateStats(){
  const dueWords = ORDERED_VOCAB.filter(v=>isIntroduced(v) && isDue(v));
  const newWords = ORDERED_VOCAB.filter(v=>isNewToday(v));
  const masteredCount = ORDERED_VOCAB.filter(v=>isMastered(v)).length;
  document.getElementById('statNew').textContent = newWords.length;
  document.getElementById('statDue').textContent = dueWords.length;
  document.getElementById('statMastered').textContent = masteredCount;

  let badge;
  if(todayIndex <= OLD_COHORT_DAYS){
    badge = 'Day ' + todayIndex + ' / ' + OLD_COHORT_DAYS;
  } else if(newCohortTodayIndex <= TOTAL_DAYS){
    badge = 'New Words Day ' + (newCohortTodayIndex - OLD_COHORT_DAYS) + ' / ' + NEW_COHORT_DAYS;
  } else {
    badge = 'Day ' + todayIndex + ' — Review Mode';
  }
  document.getElementById('dayBadge').textContent = badge;
}

// ---------- Flashcard renderer (used by both review + learn tabs) ----------
function renderFlashcardQueue(containerId, words, emptyMsg){
  const el = document.getElementById(containerId);
  if(words.length===0){
    el.innerHTML = '<div class="empty"><div class="big">&#127881;</div>'+emptyMsg+'</div>';
    return;
  }
  let idx = 0;
  let flipped = false;

  function draw(){
    if(idx >= words.length){
      el.innerHTML = '<div class="empty"><div class="big">&#9989;</div>Nice work — this set is done. Check another tab.</div>';
      updateStats();
      return;
    }
    const v = words[idx];
    flipped = false;
    el.innerHTML = `
      <div class="card">
        <div class="word">${v.w}</div>
        <div class="pos">${v.p}</div>
        <div class="pron-row">
          <span class="ipa">${v.ipa}</span>
          <button class="play-btn play-btn-front" title="Play pronunciation">&#128266;</button>
        </div>
        <div class="hint">${idx+1} / ${words.length} &middot; tap card to flip</div>
      </div>
      <div class="btn-row" style="display:none;">
        <button class="btn-again">Didn't know it</button>
        <button class="btn-hard">Kind of fuzzy</button>
        <button class="btn-good">Knew it</button>
      </div>
    `;
    el.querySelector('.card').onclick = flip;
    el.querySelector('.play-btn-front').onclick = (ev)=>{ ev.stopPropagation(); speakWord(v.w); };
    const btns = el.querySelectorAll('.btn-row button');
    btns[0].onclick = ()=>answer(0);
    btns[1].onclick = ()=>answer(1);
    btns[2].onclick = ()=>answer(2);
  }
  function flip(){
    if(flipped) return;
    flipped = true;
    const v = words[idx];
    let examplesHtml = `<div class="ex"><span class="ex-label">Example</span>${v.e.replace('___', '<b>'+v.w+'</b>')}</div>`;
    if(v.e2){
      examplesHtml += `<div class="ex"><span class="ex-label">From your word list</span>${boldify(v.e2)}</div>`;
    }
    el.querySelector('.card').innerHTML = `
      <div class="word">${v.w}</div>
      <div class="pos">${v.p}</div>
      <div class="pron-row">
        <span class="ipa">${v.ipa}</span>
        <button class="play-btn play-btn-back" title="Play pronunciation">&#128266;</button>
      </div>
      <div class="def">${v.d}</div>
      ${examplesHtml}
    `;
    el.querySelector('.play-btn-back').onclick = (ev)=>{ ev.stopPropagation(); speakWord(v.w); };
    el.querySelector('.btn-row').style.display = 'flex';
  }
  function answer(q){
    markResult(words[idx], q);
    idx++;
    draw();
  }
  draw();


}

function renderReviewPanel(){
  const words = shuffle(ORDERED_VOCAB.filter(v=>isIntroduced(v) && isDue(v)));
  renderFlashcardQueue('panel-review', words, 'Nothing due for review right now — try the "New Words" tab.');
}
function renderLearnPanel(){
  const words = ORDERED_VOCAB.filter(v=>v.day===effectiveTodayFor(v));
  let emptyMsg;
  if(todayIndex <= OLD_COHORT_DAYS){
    emptyMsg = "You've finished today's new words. Come back tomorrow!";
  } else if(newCohortStartDate && newCohortTodayIndex <= TOTAL_DAYS){
    emptyMsg = "You've finished today's new words from the new 518-word list. Come back tomorrow!";
  } else if(!newCohortStartDate){
    emptyMsg = "You've finished the original 25-day plan! The next 518 words will start rolling out — check back soon.";
  } else {
    emptyMsg = "All " + ORDERED_VOCAB.length + " words have been introduced — nice work! Keep using the Review tab to stay sharp.";
  }
  renderFlashcardQueue('panel-learn', words, emptyMsg);
}

// ---------- Quiz (definition matching, all English) ----------
function renderQuizPanel(){
  const pool = ORDERED_VOCAB.filter(v=>isIntroduced(v));
  const el = document.getElementById('panel-quiz');
  if(pool.length < 4){
    el.innerHTML = '<div class="empty"><div class="big">&#128214;</div>Not enough words unlocked yet — learn a few more days first.</div>';
    return;
  }
  let idx = 0;
  const queue = weightedSample(pool, Math.min(15, pool.length));

  function draw(){
    if(idx >= queue.length){
      el.innerHTML = '<div class="empty"><div class="big">&#9989;</div>Round complete! Switch tabs and come back for another round.</div>';
      updateStats();
      return;
    }
    const v = queue[idx];
    const wrongs = shuffle(pool.filter(x=>x.id!==v.id)).slice(0,3);
    const options = shuffle([v, ...wrongs]);
    el.innerHTML = `
      <div class="q-word">${v.w} <span style="font-size:13px;color:var(--gold);font-style:italic;">${v.p}</span></div>
      <div class="q-sub">Choose the correct definition (${idx+1}/${queue.length})</div>
      <div id="qOptions"></div>
    `;
    const opt = document.getElementById('qOptions');
    options.forEach(o=>{
      const b = document.createElement('div');
      b.className = 'choice';
      b.textContent = o.d;
      b.onclick = ()=>{
        const correct = o.id===v.id;
        b.classList.add(correct?'correct':'wrong');
        if(!correct){
          [...opt.children].forEach(c=>{ if(c.textContent===v.d) c.classList.add('correct'); });
        }
        markResult(v, correct?2:0);
        [...opt.children].forEach(c=>c.onclick=null);
        setTimeout(()=>{ idx++; draw(); }, 900);
      };
      opt.appendChild(b);
    });
  }
  draw();
}

// ---------- Fill in the blank: word-only options, reveal definition after click ----------
function renderFillPanel(){
  const pool = ORDERED_VOCAB.filter(v=>isIntroduced(v));
  const el = document.getElementById('panel-fill');
  if(pool.length < 4){
    el.innerHTML = '<div class="empty"><div class="big">&#128214;</div>Not enough words unlocked yet — learn a few more days first.</div>';
    return;
  }
  let idx = 0;
  const queue = weightedSample(pool, Math.min(15, pool.length));

  function draw(){
    if(idx >= queue.length){
      el.innerHTML = '<div class="empty"><div class="big">&#9989;</div>Round complete! This is the closest practice to an SAT sentence-completion question.</div>';
      updateStats();
      return;
    }
    const v = queue[idx];
    // Alternate between the two known example sentences for this word so
    // the same exact sentence doesn't show up every single time.
    let sentence = v.e;
    if(v.e2 && Math.random() < 0.5){
      sentence = boldify(v.e2).replace(/<b>(.*?)<\/b>/, '<span class="blank">______</span>');
      // if the target word wasn't wrapped in **bold** in this sentence, fall back
      if(sentence.indexOf('class="blank"')===-1){
        sentence = v.e2.replace(new RegExp('\\*\\*'+v.w+'.*?\\*\\*','i'), '<span class="blank">______</span>');
      }
      if(sentence.indexOf('class="blank"')===-1) sentence = v.e; // final fallback
    } else {
      sentence = v.e.replace('___', '<span class="blank">______</span>');
    }
    const wrongs = shuffle(pool.filter(x=>x.id!==v.id)).slice(0,3);
    const options = shuffle([v, ...wrongs]);
    el.innerHTML = `
      <div class="q-sent">${sentence}</div>
      <div class="q-sub">Pick the word that best fits the blank (${idx+1}/${queue.length})</div>
      <div id="fOptions"></div>
    `;
    const opt = document.getElementById('fOptions');
    options.forEach(o=>{
      const b = document.createElement('div');
      b.className = 'choice';
      b.innerHTML = '<span class="cw">'+o.w+'</span>';
      b.onclick = ()=>{
        const correct = o.id===v.id;
        b.classList.add(correct?'correct':'wrong');
        b.innerHTML = '<span class="cw">'+o.w+'</span><span class="cd">'+o.d+'</span>';
        if(!correct){
          [...opt.children].forEach(c=>{
            if(c.querySelector('.cw') && c.querySelector('.cw').textContent===v.w){
              c.classList.add('correct');
              c.innerHTML = '<span class="cw">'+v.w+'</span><span class="cd">'+v.d+'</span>';
            }
          });
        }
        markResult(v, correct?2:0);
        [...opt.children].forEach(c=>c.onclick=null);
        setTimeout(()=>{ idx++; draw(); }, 1300);
      };
      opt.appendChild(b);
    });
  }
  draw();
}

// ---------- Progress panel ----------
function renderProgressPanel(){
  const el = document.getElementById('panel-progress');
  const introduced = ORDERED_VOCAB.filter(isIntroduced);
  const mastered = introduced.filter(isMastered).length;
  const learning = introduced.filter(v=>{const r=progress[v.id]; return r && r.box>0 && r.box<5;}).length;
  const fresh = introduced.length - mastered - learning;
  const dayCap = todayIndex <= OLD_COHORT_DAYS
    ? todayIndex
    : (newCohortStartDate ? Math.min(newCohortTodayIndex, TOTAL_DAYS) : OLD_COHORT_DAYS);
  const byDay = {};
  for(let d=1; d<=dayCap; d++){
    const words = ORDERED_VOCAB.filter(v=>v.day===d);
    const done = words.filter(v=>progress[v.id] && progress[v.id].seen>0).length;
    byDay[d] = {total:words.length, done};
  }
  let rows = '';
  if(todayIndex > OLD_COHORT_DAYS && (!newCohortStartDate || newCohortTodayIndex <= TOTAL_DAYS)){
    rows += `<div style="font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;color:var(--muted);margin-bottom:8px;">The original 25-day plan is complete — now rolling out the 518 additional words over 5 more days.</div>`;
  } else if(newCohortStartDate && newCohortTodayIndex > TOTAL_DAYS){
    rows += `<div style="font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;color:var(--muted);margin-bottom:8px;">All ${ORDERED_VOCAB.length} words are complete — now in ongoing review mode.</div>`;
  }
  for(let d=dayCap; d>=1; d--){
    const info = byDay[d];
    const pct = info.total ? Math.round(100*info.done/info.total) : 0;
    rows += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;">
      <div style="width:52px;color:var(--muted)">Day ${d}</div>
      <div style="flex:1;background:#eee;border-radius:6px;height:8px;overflow:hidden;">
        <div style="width:${pct}%;background:var(--navy-2);height:8px;"></div>
      </div>
      <div style="width:60px;text-align:right;color:var(--muted)">${info.done}/${info.total}</div>
    </div>`;
  }
  el.innerHTML = `
    <div class="stat-row">
      <div class="stat"><b>${ORDERED_VOCAB.length}</b><span>Total Words</span></div>
      <div class="stat"><b>${introduced.length}</b><span>Unlocked</span></div>
      <div class="stat"><b>${mastered}</b><span>Mastered</span></div>
    </div>
    <div style="font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;color:var(--muted);margin-bottom:10px;">
      Learning: ${learning} &middot; Just started: ${fresh} &middot; Mastered (5+ correct in a row): ${mastered}
    </div>
    <div style="border-top:1px solid var(--line);padding-top:10px;">${rows}</div>
  `;
}

function renderAll(){
  updateStats();
  renderReviewPanel();
  renderLearnPanel();
  renderQuizPanel();
  renderFillPanel();
  renderProgressPanel();
  renderAccountPanel();
}

document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='quiz') renderQuizPanel();
    if(btn.dataset.tab==='fill') renderFillPanel();
    if(btn.dataset.tab==='progress') renderProgressPanel();
    if(btn.dataset.tab==='account') renderAccountPanel();
  });
});

document.getElementById('resetLink').addEventListener('click', async ()=>{
  if(!confirm('Reset all learning progress? This cannot be undone.')) return;
  progress = {};
  startDate = todayMs();
  todayIndex = 1;
  await saveProgress();
  renderAll();
});

(async function init(){
  await loadState();
  renderAll();
})();
</script>
</body>
</html>
